; ESP32-S3 QR Code USB Reader
; PlatformIO Configuration

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Custom partition table with two OTA slots
board_build.partitions = partitions.csv

; Serial monitor
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    ; Enable native ESP-IDF HTTPS server (required by PsychicHttp)
    -DCONFIG_ESP_HTTPS_SERVER_ENABLE=1
    ; Enable WebSocket support in the HTTP daemon
    -DCONFIG_HTTPD_WS_SUPPORT=1

lib_deps =
    ; HTTPS server with Arduino-friendly API (wraps esp_https_server)
    hoeken/PsychicHttp
    ; URL encode / decode helpers
    plageoj/UrlEncode@^1.0.1
    ; JSON for config serialization
    bblanchon/ArduinoJson@^7.3.0
